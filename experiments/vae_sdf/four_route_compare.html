<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>G0 四路线 · 2×5 对比</title>
<style>
:root{color-scheme:dark;font:13px system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#10151d;color:#e6edf7;display:flex;height:100vh}
aside{width:260px;flex:none;border-right:1px solid #344155;display:flex;flex-direction:column}header{padding:12px}h1{font-size:17px;margin:0 0 8px}a{color:#8cc8f2}.muted{color:#a5b2c5;font-size:11px;line-height:1.45}input,select,button{background:#1c2634;color:#e6edf7;border:1px solid #45546b;border-radius:5px;padding:6px}#search{width:100%;margin-top:10px}#list{overflow:auto;flex:1}.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #25303f;border-radius:0;background:transparent;padding:8px 10px}.item.active{background:#26384e}.item small{display:block;color:#a5b2c5}main{flex:1;min-width:0;display:flex;flex-direction:column}#toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px;border-bottom:1px solid #344155}#toolbar label{white-space:nowrap}#details{padding:7px 10px;min-height:46px;max-height:104px;overflow:auto;white-space:pre-line;background:#111a27}#grid{flex:1;min-height:0;position:relative;background:#0c1119}canvas{width:100%;height:100%;display:block;touch-action:none}#labels{position:absolute;inset:0;display:grid;pointer-events:none}.cell{border:1px solid #2d3848;position:relative;overflow:hidden}.cell .tag{position:absolute;left:5px;top:5px;background:#111a27d9;padding:3px 5px;max-width:calc(100% - 10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell .status{position:absolute;left:5px;bottom:5px;color:#a5b2c5;background:#111a27d9;padding:2px 4px;max-width:calc(100% - 10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowlabel{font-weight:bold;color:#f0c987}#hint{padding:5px 9px;border-top:1px solid #344155}
</style></head><body>
<aside><header><h1>G0 四路线对比</h1><div class="muted"><a href="/">G0 浏览器</a> · G0b 历史网格已清理<br>R128 · 相位 0.5 · 原坐标系</div><input id="search" placeholder="文件名或 index"><div id="count" class="muted"></div></header><div id="list"></div></aside>
<main><div id="toolbar"><label>拟合法线 <select id="mode"><option value="smooth">smooth</option><option value="flat">flat</option></select></label><label>显示着色 <select id="shading"><option value="flat">flat</option><option value="smooth">smooth</option></select></label><label>精度 <select id="quality"><option value="preview">快速预览</option><option value="full">原精度</option></select></label><span>显示列：</span><label><input type="checkbox" class="column" value="A1" checked>A1</label><label><input type="checkbox" class="column" value="A2" checked>A2</label><label><input type="checkbox" class="column" value="A3" checked>A3</label><label><input type="checkbox" class="column" value="A4" checked>A4</label><label><input id="wire" type="checkbox">线框</label><button id="reset">重置视角</button></div><div id="details">正在加载清单…</div><div id="grid"><canvas id="canvas"></canvas><div id="labels"></div></div><div id="hint" class="muted">两行共用 A1/A2 场，各用该行提取器。切换拟合法线会加载独立 A3/A4 拟合缓存。左键旋转 · 中键平移 · 滚轮缩放。预览简化不改变原精度指标。</div></main>
<script>
const $=id=>document.getElementById(id), rows=[], loaded=new Map(), pending=new Map();
let selected=-1, catalog=null, generation=0, frame=null, cells=[];
const camera={yaw:.5,pitch:.25,distance:2.3,panX:0,panY:0};
const canvas=$('canvas'),gl=canvas.getContext('webgl2',{antialias:true});
if(!gl){$('details').textContent='需要 WebGL2';throw Error('WebGL2 unavailable')}
const vs=`#version 300 es
layout(location=0) in vec3 position;layout(location=1) in vec3 normal;uniform mat4 projection;uniform vec3 center;uniform float scale,yaw,pitch,distance;uniform vec2 pan;out vec3 viewPos,viewNormal;
void main(){vec3 p=(position-center)*scale;float cy=cos(yaw),sy=sin(yaw),cp=cos(pitch),sp=sin(pitch);vec3 r=vec3(cy*p.x+sy*p.z,p.y,-sy*p.x+cy*p.z);vec3 v=vec3(r.x+pan.x,cp*r.y-sp*r.z+pan.y,sp*r.y+cp*r.z-distance);viewPos=v;vec3 n=vec3(cy*normal.x+sy*normal.z,normal.y,-sy*normal.x+cy*normal.z);viewNormal=vec3(n.x,cp*n.y-sp*n.z,sp*n.y+cp*n.z);gl_Position=projection*vec4(v,1.);}`;
const fs=`#version 300 es
precision highp float;in vec3 viewPos,viewNormal;uniform vec3 tint;uniform bool smoothShade,wire;out vec4 color;void main(){vec3 n=smoothShade?normalize(viewNormal):normalize(cross(dFdx(viewPos),dFdy(viewPos)));float light=.27+.73*abs(dot(n,normalize(vec3(.35,.7,.6))));color=vec4(tint*(wire?1.:light),1.);}`;
function shader(type,code){const s=gl.createShader(type);gl.shaderSource(s,code);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
const u=Object.fromEntries(['projection','center','scale','yaw','pitch','distance','pan','tint','smoothShade','wire'].map(k=>[k,gl.getUniformLocation(program,k)]));gl.enable(gl.DEPTH_TEST);
function parse(buffer){const d=new DataView(buffer);if(buffer.byteLength<8)throw Error('网格数据过短');const nv=d.getUint32(0,true),nf=d.getUint32(4,true);if(!nv||!nf||buffer.byteLength!==8+12*(nv+nf))throw Error('网格长度无效');const v=new Float32Array(buffer,8,nv*3),f=new Uint32Array(buffer,8+12*nv,nf*3),n=new Float32Array(nv*3),lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];for(let i=0;i<nv;i++)for(let k=0;k<3;k++){const x=v[3*i+k];if(!Number.isFinite(x))throw Error('坐标无效');lo[k]=Math.min(lo[k],x);hi[k]=Math.max(hi[k],x)}for(let i=0;i<f.length;i+=3){const a=f[i],b=f[i+1],c=f[i+2];if(a>=nv||b>=nv||c>=nv)throw Error('面索引越界');const ax=v[3*b]-v[3*a],ay=v[3*b+1]-v[3*a+1],az=v[3*b+2]-v[3*a+2],bx=v[3*c]-v[3*a],by=v[3*c+1]-v[3*a+1],bz=v[3*c+2]-v[3*a+2],q=[ay*bz-az*by,az*bx-ax*bz,ax*by-ay*bx];for(const j of [a,b,c])for(let k=0;k<3;k++)n[3*j+k]+=q[k]}for(let i=0;i<nv;i++){const j=3*i,l=Math.hypot(n[j],n[j+1],n[j+2])||1;n[j]/=l;n[j+1]/=l;n[j+2]/=l}return {v,f,n,lo,hi,nf,gpu:null}}
function meshKey(row,stage){if(stage==='source')return 'source';if(stage==='A1'||stage==='A2')return `${row}_${stage}`;return `${row}_${stage}_${$('mode').value}`}
function route(row){return `${row==='mc'?'mc':'flexicubes'}_${$('mode').value}`}
function visible(){return ['source',...Array.from(document.querySelectorAll('.column:checked'),x=>x.value)]}
function entry(row,stage){if(!catalog)return null;return catalog.cells[route(row)][stage]}
function caption(meta,mesh){const raw=meta?.metrics?.faces;const count=mesh?(raw==null?`${mesh.nf} 预览面`:`原面 ${raw} · 预览 ${mesh.nf}`):(raw==null?(meta?.status||'等待目录'):`原面 ${raw}`);const chamfer=meta?.metrics?.chamfer_l1;return chamfer==null?count:`${count} · Chamfer ${Number(chamfer).toPrecision(4)}`}
function layout(){const stages=visible(),labels=$('labels');labels.replaceChildren();labels.style.gridTemplateColumns=`repeat(${stages.length},minmax(0,1fr))`;labels.style.gridTemplateRows='repeat(2,minmax(0,1fr))';cells=[];for(const row of ['mc','flexicubes'])for(const stage of stages){const key=meshKey(row,stage),meta=stage==='source'?{status:'ready'}:entry(row,stage),cell=document.createElement('div');cell.className='cell';const tag=document.createElement('div');tag.className='tag';tag.textContent=`${row==='mc'?'Classic MC':'FlexiCubes'} · ${stage}${stage==='A3'||stage==='A4'?' · '+route(row):''}`;const status=document.createElement('div');status.className='status';status.textContent=pending.has(key)?'加载中…':caption(meta,loaded.get(key));cell.append(tag,status);labels.append(cell);cells.push({row,stage,key,meta,cell,status})}const visibleKeys=new Set(cells.map(c=>c.key));for(const [key,controller] of pending)if(!visibleKeys.has(key)){controller.abort();pending.delete(key)}draw();loadVisible()}
function gpu(mesh){if(mesh.gpu)return mesh.gpu;const make=(target,arr)=>{const b=gl.createBuffer();gl.bindBuffer(target,b);gl.bufferData(target,arr,gl.STATIC_DRAW);return b};mesh.gpu={v:make(gl.ARRAY_BUFFER,mesh.v),n:make(gl.ARRAY_BUFFER,mesh.n),f:make(gl.ELEMENT_ARRAY_BUFFER,mesh.f),lines:null,count:mesh.f.length};return mesh.gpu}
function draw(){const w=Math.max(1,Math.round(canvas.clientWidth*devicePixelRatio)),h=Math.max(1,Math.round(canvas.clientHeight*devicePixelRatio));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}gl.viewport(0,0,w,h);gl.clearColor(.05,.07,.1,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);if(!frame||!cells.length)return;gl.useProgram(program);gl.enable(gl.SCISSOR_TEST);gl.uniform3fv(u.center,frame.center);gl.uniform1f(u.scale,frame.scale);gl.uniform1f(u.yaw,camera.yaw);gl.uniform1f(u.pitch,camera.pitch);gl.uniform1f(u.distance,camera.distance);gl.uniform2f(u.pan,camera.panX,camera.panY);gl.uniform1i(u.smoothShade,$('shading').value==='smooth');const columns=visible().length;for(let i=0;i<cells.length;i++){const m=loaded.get(cells[i].key);if(!m)continue;const col=i%columns,row=Math.floor(i/columns),x=Math.floor(col*w/columns),x2=Math.floor((col+1)*w/columns),y=Math.floor((1-row)*h/2),y2=Math.floor((2-row)*h/2);gl.viewport(x,y,x2-x,y2-y);gl.scissor(x,y,x2-x,y2-y);gl.clear(gl.DEPTH_BUFFER_BIT);const bw=x2-x,bh=y2-y,f=1/Math.tan(Math.PI/8),near=.01,far=100;gl.uniformMatrix4fv(u.projection,false,new Float32Array([f*bh/bw,0,0,0,0,f,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0]));const colors={source:[.8,.84,.9],A1:[.8,.5,.25],A2:[.86,.68,.3],A3:[.38,.75,.84],A4:[.5,.72,1.]};gl.uniform3fv(u.tint,colors[cells[i].stage]);const b=gpu(m);gl.bindBuffer(gl.ARRAY_BUFFER,b.v);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,b.n);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b.f);gl.uniform1i(u.wire,0);gl.drawElements(gl.TRIANGLES,b.count,gl.UNSIGNED_INT,0);if($('wire').checked){if(!b.lines){const edges=new Uint32Array(m.f.length*2);for(let j=0;j<m.f.length;j+=3){const k=2*j;edges[k]=m.f[j];edges[k+1]=m.f[j+1];edges[k+2]=m.f[j+1];edges[k+3]=m.f[j+2];edges[k+4]=m.f[j+2];edges[k+5]=m.f[j]}b.lines=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b.lines);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,edges,gl.STATIC_DRAW);b.lineCount=edges.length}gl.uniform1i(u.wire,1);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b.lines);gl.drawElements(gl.LINES,b.lineCount,gl.UNSIGNED_INT,0)}}gl.disable(gl.SCISSOR_TEST)}
async function fetchMesh(c){if(selected<0||!catalog||c.stage!=='source'&&c.meta?.status!=='ready'||loaded.has(c.key)||pending.has(c.key))return;const version=generation,index=selected,controller=new AbortController();pending.set(c.key,controller);c.status.textContent='加载中…';try{const sha=c.stage==='source'?catalog.source_sha256:c.meta?.sha256;const response=await fetch(`/api/four-route/mesh/${index}/${route(c.row)}/${c.stage}/${$('quality').value}?sha=${sha}`,{signal:controller.signal});if(!response.ok)throw Error(`HTTP ${response.status}`);const m=parse(await response.arrayBuffer());if(version!==generation)return;loaded.set(c.key,m);if(c.stage==='source')frame={center:m.lo.map((x,k)=>(x+m.hi[k])/2),scale:1/Math.max(...m.hi.map((x,k)=>x-m.lo[k]),1e-9)};c.status.textContent=caption(c.meta,m);draw()}catch(e){if(version===generation&&e.name!=='AbortError')c.status.textContent=`加载失败：${e.message}`}finally{if(pending.get(c.key)===controller)pending.delete(c.key)}}
function loadVisible(){for(const c of cells)fetchMesh(c)}
function renderList(){const q=$('search').value.trim().toLowerCase();$('list').replaceChildren();const found=rows.filter(r=>q===''||String(r.index)===q||r.name.toLowerCase().includes(q));$('count').textContent=`${found.length} / ${rows.length} 件`;for(const r of found){const b=document.createElement('button');b.className='item'+(r.index===selected?' active':'');b.textContent=`${r.index} · ${r.name}`;const small=document.createElement('small');small.textContent=`${r.category} · ${r.watertight?'闭合候选':'非闭合'}`;b.append(small);b.onclick=()=>select(r.index);$('list').append(b)}}
async function select(index){selected=index;generation++;for(const c of pending.values())c.abort();pending.clear();loaded.clear();frame=null;catalog=null;camera.yaw=.5;camera.pitch=.25;camera.distance=2.3;camera.panX=0;camera.panY=0;history.replaceState(null,'',`/compare?index=${index}`);renderList();layout();$('details').textContent=`index ${index} · ${rows[index].name}\n读取四路线目录…`;const version=generation;try{const response=await fetch(`/api/four-route/catalog/${index}`);if(!response.ok)throw Error(`HTTP ${response.status}`);const result=await response.json();if(version!==generation)return;if(result.asset_id!==rows[index].id)throw Error('资产身份不一致');catalog=result;const states=Object.values(result.cells).flatMap(r=>Object.values(r)).reduce((a,x)=>(a[x.status]=(a[x.status]||0)+1,a),{});$('details').textContent=`index ${index} · ${rows[index].name}\n源 SHA256 ${result.source_sha256} · R${result.resolution} phase=${result.sampling_offset}\n四路线阶段：${JSON.stringify(states)}。指标来自各缓存原精度网格。`;layout()}catch(e){if(version===generation)$('details').textContent=`目录失败：${e.message}`}}
let drag=null;canvas.onpointerdown=e=>{if(e.button!==0&&e.button!==1)return;e.preventDefault();drag={id:e.pointerId,button:e.button,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.onauxclick=e=>{if(e.button===1)e.preventDefault()};canvas.onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(drag.button===1){const units=2*camera.distance*Math.tan(Math.PI/8)/Math.max(canvas.clientHeight/2,1);camera.panX+=dx*units;camera.panY-=dy*units}else{camera.yaw+=dx*.008;camera.pitch=Math.max(-1.5,Math.min(1.5,camera.pitch+dy*.008))}drag.x=e.clientX;drag.y=e.clientY;draw()};canvas.onwheel=e=>{e.preventDefault();camera.distance=Math.max(.8,Math.min(20,camera.distance*Math.exp(e.deltaY*.001)));draw()};
$('reset').onclick=()=>{Object.assign(camera,{yaw:.5,pitch:.25,distance:2.3,panX:0,panY:0});draw()};$('mode').onchange=layout;$('shading').onchange=draw;$('wire').onchange=draw;$('quality').onchange=()=>{for(const c of pending.values())c.abort();pending.clear();loaded.clear();frame=null;generation++;layout()};$('search').oninput=renderList;document.querySelectorAll('.column').forEach(x=>x.onchange=layout);window.onresize=draw;
fetch('/api/catalog').then(r=>r.json()).then(data=>{rows.push(...data.rows);renderList();const requested=Number(new URLSearchParams(location.search).get('index'));select(Number.isInteger(requested)&&requested>=0&&requested<rows.length?requested:48)}).catch(e=>$('details').textContent=`清单失败：${e.message}`);
</script></body></html>
